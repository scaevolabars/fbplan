[project]
name = "fbplan"
version = "0.1.0"
description = "Planning over sequences of intentions with frozen FB representations (OGBench AntMaze)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "jax>=0.4.38",
    "jax[cuda12]>=0.4.38; sys_platform == 'linux'",
    "flax>=0.10.2",
    "optax",
    "distrax>=0.1.5",
    "ml-collections>=1.1.0",
    "ogbench==1.1.4",
    "gymnasium==0.29.1",
    "h5py==3.12.1",
    "matplotlib>=3.10.7",
    "pandas",
    "tqdm",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fbplan"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
