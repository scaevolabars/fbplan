[project]
name = "fbplan"
version = "0.1.0"
description = "Planning over sequences of intentions with frozen FB representations (OGBench AntMaze)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "jax>=0.4.38",
    "jax[cuda12]>=0.4.38; sys_platform == 'linux'",
    "flax>=0.10.2",
    "optax",
    "distrax>=0.1.5",
    "ml-collections>=1.1.0",
    "ogbench==1.1.4",
    "gymnasium==0.29.1",
    "matplotlib>=3.10.7",
    "pandas",
    "tqdm",  # upstream utils.evaluation, used by analysis/parity.py
    "mujoco==3.1.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
viz = [
    "imageio-ffmpeg>=0.7.0",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fbplan"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Plot scripts select the matplotlib backend before they import pyplot.
"analysis/*.py" = ["E402"]
"fbplan/learned/diagnostics.py" = ["E402"]
"fbplan/tabular/{study_plots,time_limit}.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." for tests of analysis/ (not a package), "tests" for helper modules such as planner_fakes.
pythonpath = [".", "tests"]
# List skipped tests: on a clone without checkpoints or datasets, some tests skip.
addopts = "-ra"
